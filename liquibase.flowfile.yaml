  # DB_Deployment:
  #   actions:
  #     - type: liquibase
  #       command: tag
  #       cmdArgs: {tag: release1}
  #     - type: liquibase
  #       command: update-testing-rollback

  Snapshot:
    actions:
      - type: liquibase
        command: snapshot
        globalArgs: { output-file: "mySnapshot.json" }
        cmdArgs: { snapshot-format: "JSON", schemas: "LIQUIBASE_USER"}

## The endStage ALWAYS RUNS. 
## So put actions here which you desire to perform whether previous stages' actions succeed or fail.
## If you do not want any actions to ALWAYS RUN, simply delete the endStage from your flow file.
endStage:
  actions:
    - type: liquibase
      command: history
