##########           LIQUIBASE FLOWFILE                ##########
##########  learn more http://docs.liquibase.com/flow  ##########

## Run this file by executing "liquibase flow" or "liquibase flow --flow-file=liquibase.flowfile.yaml"

# globalVariables:
#   BYPASS_LIQUIBASE_CHECKS: bypass

## Note: Any command which fails in any stage below result in the command stopping, and endStage being run.
## A flow file can have one or more stages, each with multiple "actions", 
## or your flow file can have multiple stages with fewer actions in each stage.
stages:

  Drift_Detection:
    actions:
      - type: liquibase
        command: diff
        # cmdArgs: { referenceUrl: "offline:sqlserver?snapshot=mySnapshot.json"}
        cmdArgs: { referenceUrl: "offline:oracle?snapshot=mySnapshot.json",
                        schemas: "LIQUIBASE_USER",
                        drift-severity: 1,
                        drift-severity-missing: 2,
                        drift-severity-unexpected: 3,
                        drift-severity-changed: 4
                    }
        globalArgs: { mirror-console-messages-to-log: "true",
                        reports-enabled: "true",
                        reports-path: "reports",
                        reports-name: "diff-report.html"}

